<h2> Product dashboard 
</h2>
 <button (click)="showProducts = !showProducts">
  Toggle Product List
 </button>

 <div *ngIf="showProducts">
  <div *ngFor = "let p of products" class = "card">
    <h3>{{p.name}}</h3>
    <p [ngClass]="{'high price': p.price > 500, 'low-price': p.price <= 500}">
      Price: ${{p.price}}
    </p>

    <div [ngSwitch]="p.status">
      <p *ngSwitchCase="'Available'"> In stock </p>
      <p *ngSwitchCase="'Out of Stock'"> Out of stock </p>
      <p *ngSwitchCase = " 'Limited Stock' "> Limited stock </p>
      <p *ngSwitchDefault> Status unknown </p>
  </div>
  <p [ngStyle]="{
    color: p.status === 'available'? 'green' : 'red',
    frontWeight: 'bold'
  }">
    Status: {{p.status}}
  </p>
  </div>
