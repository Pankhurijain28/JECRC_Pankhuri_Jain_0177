<div class="container">

  <h2>Transaction History</h2>

  <!-- FILTER -->
  <div class="filter">
    <input type="date" [(ngModel)]="selectedDate">
    <button (click)="filterByDate()">Filter</button>
    <button (click)="reset()">Reset</button>
  </div>

  <!-- ADD BUTTON -->
  <button class="add-btn" (click)="openModal()">+ Add Transaction</button>

  <!-- MODAL -->
  <div class="modal" *ngIf="showModal">
    <div class="modal-content">

      <h3>Add Transaction</h3>

      <input type="date" [(ngModel)]="formData.date">

      <input type="text" placeholder="Description"
             [(ngModel)]="formData.description">

      <select [(ngModel)]="formData.type">
        <option [value]="0">Credit</option>
        <option [value]="1">Debit</option>
      </select>

      <input type="number" placeholder="Amount"
             [(ngModel)]="formData.amount">

      <div class="modal-buttons">
        <button (click)="submitTransaction()">Add</button>
        <button class="cancel" (click)="closeModal()">Cancel</button>
      </div>

    </div>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Type</th>
        <th (click)="sortByAmount()">Amount ($)</th>
        <th>Balance</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let t of filteredTransactions">
        <td>{{ t.date | date:'yyyy-MM-dd' }}</td>
        <td>{{ t.description }}</td>
        <td>{{ t.type === 0 ? 'Credit' : 'Debit' }}</td>
        <td>{{ t.amount }}</td>
        <td>{{ t.balance }}</td>
      </tr>
    </tbody>
  </table>

</div>
