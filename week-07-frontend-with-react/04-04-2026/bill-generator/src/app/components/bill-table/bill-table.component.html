<table>
  <tr>
    <th>Name</th>
    <th>Qty</th>
    <th>Price</th>
    <th>Total</th>
    <th></th>
  </tr>

  <tr *ngFor="let item of items; let i = index">
    <td>{{item.name}}</td>
    <td><input type="number" [(ngModel)]="item.qty"></td>
    <td><input type="number" [(ngModel)]="item.price"></td>
    <td>{{item.qty * item.price}}</td>
    <td><button (click)="remove(i)">❌</button></td>
  </tr>
</table>
