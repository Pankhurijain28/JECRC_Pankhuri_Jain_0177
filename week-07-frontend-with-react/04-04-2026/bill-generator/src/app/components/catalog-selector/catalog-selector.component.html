<div class="catalog">

  <div class="tabs">
    <button (click)="activeTab='Entrance'">🎟 Entrance</button>
    <button (click)="activeTab='Donation'">💰 Donation</button>
    <button (click)="activeTab='Product'">🛍 Products</button>
  </div>

  <input placeholder="Search..." [(ngModel)]="search">

  <div class="items">
    <div class="card" *ngFor="let item of filteredItems()" (click)="select(item)">
      <h4>{{item.name}}</h4>
      <p>₹ {{item.price}}</p>
    </div>
  </div>

</div>
