services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Strong@1234"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  api:
    build: ./EMS.API
    container_name: ems-api
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EMSDB;User=sa;Password=Strong@1234;TrustServerCertificate=True

  mvc:
    build: ./EMS.MVC
    container_name: ems-mvc
    ports:
      - "5001:8080"
    depends_on:
      - api