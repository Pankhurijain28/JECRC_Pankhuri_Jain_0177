version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: food_sqlserver

    environment:
      SA_PASSWORD: "Strong@1234"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

  foodordering_api:
    build:
      context: .
      dockerfile: FoodOrdering.API/Dockerfile

    container_name: food_api

    depends_on:
      - sqlserver

    environment:
      ConnectionStrings__DefaultConnection:
        Server=sqlserver;
        Database=FoodOrderingDb;
        User=sa;
        Password=Strong@1234;
        TrustServerCertificate=True;

    ports:
      - "5187:8080"

  foodordering_mvc:
    build:
      context: .
      dockerfile: FoodOrdering.MVC/Dockerfile

    container_name: food_mvc

    depends_on:
      - foodordering_api

    ports:
      - "5000:8080"

volumes:
  sql_data: